<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1214">
<title>Ordinatio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1214;
  --surface:#1a1f24;
  --surface-2:#242a30;
  --surface-3:#2d343b;
  --line:#2a3138;
  --line-2:#374049;
  --ink:#f5f7fa;
  --ink-2:#c6ccd4;
  --ink-3:#8892a0;
  --ink-4:#525a66;
  --rvdl:#4a90e2;
  --rvdl-soft:rgba(74,144,226,.14);
  --rvdl-line:rgba(74,144,226,.32);
  --scm:#4dabf7;
  --scm-soft:rgba(77,171,247,.14);
  --scm-line:rgba(77,171,247,.32);
  --scm-deep:#1a5490;
  --green:#51cf66;
  --amber:#ffa94d;
  --red:#ff6b6b;
  --r-lg:20px;
  --r:14px;
  --r-sm:10px;
  --shadow:0 4px 16px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.2);
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11';
}
.app{
  max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 24px);
}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}
.top-brand{display:flex;align-items:center;gap:10px}
.brand-dot{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--rvdl) 0%,var(--scm) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:#fff;
}
.brand-txt{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.01em}
.brand-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.sync-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;font-weight:500;color:var(--ink-3);
}
.sync-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.sync-chip.ok .dot{background:var(--green)}
.sync-chip.err .dot{background:var(--red)}
.sync-chip.ok{color:var(--green)}
.sync-chip.err{color:var(--red)}

.hello{margin-bottom:22px}
.hello-greet{
  font-family:'Fraunces',serif;font-weight:500;
  font-size:26px;line-height:1.2;color:var(--ink);
  letter-spacing:-0.02em;
}
.hello-date{font-size:14px;color:var(--ink-3);margin-top:4px}

.main-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;
}
.action-btn{
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;
  padding:20px 18px;border-radius:var(--r-lg);
  text-decoration:none;min-height:150px;
  position:relative;overflow:hidden;
  transition:transform .12s;border:1px solid transparent;
}
.action-btn:active{transform:scale(.97)}
.action-btn.rvdl{
  background:linear-gradient(160deg, rgba(74,144,226,0.22) 0%, rgba(74,144,226,0.08) 100%);
  border-color:var(--rvdl-line);
}
.action-btn.scm{
  background:linear-gradient(160deg, rgba(77,171,247,0.18) 0%, rgba(26,84,144,0.28) 100%);
  border-color:var(--scm-line);
}
.action-icon{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
}
.action-icon svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.action-body{margin-top:auto;padding-top:16px}
.action-label{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;
}
.action-title{
  font-family:'Fraunces',serif;font-weight:600;
  font-size:19px;color:var(--ink);letter-spacing:-0.01em;
}
.action-arrow{
  position:absolute;top:20px;right:18px;
  color:var(--ink-3);font-size:18px;transition:transform .12s;
}
.action-btn:active .action-arrow{transform:translateX(4px)}

.section-title{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.1em;
  margin:26px 4px 12px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.section-title .meta{
  font-size:11px;color:var(--ink-4);
  text-transform:none;letter-spacing:0;font-weight:500;
  font-family:'JetBrains Mono',monospace;
}

.today-card,.week-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;
}
.today-empty{text-align:center;padding:16px 0;color:var(--ink-3);font-size:13px}
.today-empty-icon{font-size:28px;margin-bottom:8px;opacity:0.4}
.today-row{
  display:grid;grid-template-columns:auto 1fr auto;
  gap:12px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--line);
}
.today-row:last-child{border-bottom:none;padding-bottom:0}
.today-row:first-child{padding-top:0}
.today-badge{
  padding:4px 10px;border-radius:20px;
  font-size:10px;font-weight:700;
  letter-spacing:0.05em;white-space:nowrap;
}
.today-badge.rvdl{background:var(--rvdl-soft);color:var(--rvdl)}
.today-badge.scm{background:var(--scm-soft);color:var(--scm)}
.today-info{min-width:0}
.today-name{
  font-size:14px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.today-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.today-value{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;
}
.today-total{
  margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.today-total-label{
  font-size:12px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;font-weight:600;
}
.today-total-value{
  font-family:'JetBrains Mono',monospace;
  font-size:20px;font-weight:600;color:var(--ink);
}

.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.week-stat{
  padding:12px 14px;background:var(--surface-2);
  border-radius:var(--r-sm);border:1px solid var(--line);
}
.week-stat-label{
  font-size:11px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.week-stat-label .swatch{width:8px;height:8px;border-radius:2px}
.week-stat-label .swatch.rvdl{background:var(--rvdl)}
.week-stat-label .swatch.scm{background:var(--scm)}
.week-stat-val{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:600;color:var(--ink);margin-top:6px;
}
.week-stat-sub{font-size:11px;color:var(--ink-4);margin-top:2px}

.side-actions{
  display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:6px;
}
.side-btn-wrap{position:relative;display:block;text-decoration:none}
.side-btn{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px 8px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;
  transition:background .12s, transform .12s;
  min-height:96px;
}
.side-btn:active{background:var(--surface-2);transform:scale(.97)}
.side-icon{
  width:36px;height:36px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
}
.side-icon svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-label{
  font-size:12px;font-weight:500;color:var(--ink-2);
  text-align:center;line-height:1.2;
}
.side-badge{
  position:absolute;top:6px;right:6px;
  font-size:10px;font-weight:700;
  background:var(--amber);color:#111;
  padding:2px 7px;border-radius:10px;
  min-width:20px;text-align:center;
}
.footer{
  margin-top:32px;padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  color:var(--ink-4);font-size:11px;
}
.footer-version{font-family:'JetBrains Mono',monospace;color:var(--ink-4)}

@media (min-width:480px){
  .app{padding-left:22px;padding-right:22px}
  .action-btn{min-height:170px}
}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="top-brand">

  <div class="main-actions">

      <div class="action-icon">

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,onSnapshot,collection,query,orderBy,getDocs}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={apiKey:"AIzaSyBW4shtJ-2UlPMg1tHs3GUrNhfg6ocKxjY",authDomain:"dagstaat-ordinatio.firebaseapp.com",projectId:"dagstaat-ordinatio",storageBucket:"dagstaat-ordinatio.firebasestorage.app",messagingSenderId:"841107130686",appId:"1:841107130686:web:f91211f83a8e031746846f"};
const fbApp=initializeApp(FB);
const db=getFirestore(fbApp);

const MO=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DYL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];

const p2 = n => String(n).padStart(2,'0');
const m2s = m => `${Math.floor(m/60)}:${p2(m%60)}`;
const tMins = t => { if(!t)return 0; const[h,m]=t.split(':').map(Number); return h*60+m; };
const bMins = b => Math.max(0,(tMins(b.end)-tMins(b.start))-(parseInt(b.brk)||0));

const now = new Date();
const yr = now.getFullYear();
const mo = now.getMonth();
const dy = now.getDate();
const uur = now.getHours();

let groet;
if (uur < 6) groet = 'Goedenacht';
else if (uur < 12) groet = 'Goedemorgen';
else if (uur < 18) groet = 'Goedemiddag';
else groet = 'Goedenavond';

document.getElementById('helloGreet').textContent = groet;
document.getElementById('helloDate').textContent = `${DYL[now.getDay()]} ${dy} ${MO[mo]}`;

function setSync(state, txt) {
  const chip = document.getElementById('syncChip');
  chip.className = 'sync-chip ' + state;
  document.getElementById('syncTxt').textContent = txt;
}

function startOfWeek(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const s = new Date(d);
  s.setDate(d.getDate() + diff);
  s.setHours(0,0,0,0);
  return s;
}
function isoDate(d) {
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}

const weekStart = startOfWeek(now);
const weekEnd = new Date(weekStart);
weekEnd.setDate(weekStart.getDate() + 6);
const todayISO = isoDate(now);

function renderVandaag(rvdlToday, scmToday) {
  const el = document.getElementById('todayCard');
  const meta = document.getElementById('vandaagMeta');
  const rvdlMins = rvdlToday.reduce((s,b)=>s+bMins(b),0);
  const scmMins = scmToday.reduce((s,p)=>s + (Number(p.aantal||0) * (p.eenheid==='dag'?480:60)), 0);
  const totalMins = rvdlMins + scmMins;

  if (rvdlToday.length === 0 && scmToday.length === 0) {
    el.innerHTML = `
      <div class="today-empty">
        <div class="today-empty-icon">✎</div>
        <div>Nog niets vandaag. Tik hierboven op <strong>Dagstaat</strong> of <strong>Uren</strong>.</div>
      </div>`;
    meta.textContent = '';
    return;
  }

  const rows = [];
  const rvdlPerKlant = {};
  rvdlToday.forEach(b => {
    const k = b.klant || 'Onbekend';
    if (!rvdlPerKlant[k]) rvdlPerKlant[k] = {mins:0, count:0};
    rvdlPerKlant[k].mins += bMins(b);
    rvdlPerKlant[k].count += 1;
  });
  Object.entries(rvdlPerKlant).forEach(([klant, info]) => {
    rows.push(`<div class="today-row">
      <div class="today-badge rvdl">RvdL</div>
      <div class="today-info">
        <div class="today-name">${klant}</div>
        <div class="today-sub">${info.count} tijdblok${info.count===1?'':'ken'}</div>
      </div>
      <div class="today-value">${m2s(info.mins)}</div>
    </div>`);
  });

  const scmPerProject = {};
  scmToday.forEach(p => {
    const k = p.project_naam || p.project_nummer || 'Onbekend project';
    if (!scmPerProject[k]) scmPerProject[k] = {aantal:0, eenheid:p.eenheid||'uur', count:0};
    scmPerProject[k].aantal += Number(p.aantal||0);
    scmPerProject[k].count += 1;
  });
  Object.entries(scmPerProject).forEach(([proj, info]) => {
    const eenheid = info.eenheid === 'dag' ? 'd' : 'u';
    rows.push(`<div class="today-row">
      <div class="today-badge scm">SCM</div>
      <div class="today-info">
        <div class="today-name">${proj}</div>
        <div class="today-sub">${info.count} post${info.count===1?'':'en'}</div>
      </div>
      <div class="today-value">${info.aantal} ${eenheid}</div>
    </div>`);
  });

  const totalHtml = `<div class="today-total">
    <div class="today-total-label">Totaal</div>
    <div class="today-total-value">${m2s(totalMins)}</div>
  </div>`;

  el.innerHTML = rows.join('') + totalHtml;
  meta.textContent = m2s(totalMins);
}

function renderWeek(rvdlWeek, scmWeek) {
  const rvdlMins = rvdlWeek.reduce((s,b)=>s+bMins(b),0);
  const scmMins = scmWeek.reduce((s,p)=>s + (Number(p.aantal||0) * (p.eenheid==='dag'?480:60)), 0);
  document.getElementById('weekRvdlVal').textContent = m2s(rvdlMins);
  document.getElementById('weekScmVal').textContent = m2s(scmMins);
  const rvdlDagen = new Set(rvdlWeek.map(b => b._date)).size;
  const scmDagen = new Set(scmWeek.map(p => p.datum)).size;
  document.getElementById('weekRvdlSub').textContent = rvdlDagen > 0 ? `over ${rvdlDagen} dag${rvdlDagen===1?'':'en'}` : 'geen';
  document.getElementById('weekScmSub').textContent = scmDagen > 0 ? `over ${scmDagen} dag${scmDagen===1?'':'en'}` : 'geen';
}

let rvdlDaysCache = {};
let scmPostsCache = [];

function combineAndRender() {
  const rvdlToday = (rvdlDaysCache[todayISO] || []).map(b => ({...b}));
  const rvdlWeek = [];
  Object.keys(rvdlDaysCache).forEach(date => {
    const d = new Date(date);
    if (d >= weekStart && d <= weekEnd) {
      rvdlDaysCache[date].forEach(b => rvdlWeek.push({...b, _date:date}));
    }
  });
  const scmToday = scmPostsCache.filter(p => p.datum === todayISO);
  const scmWeek = scmPostsCache.filter(p => {
    if (!p.datum) return false;
    const d = new Date(p.datum);
    return d >= weekStart && d <= weekEnd;
  });
  renderVandaag(rvdlToday, scmToday);
  renderWeek(rvdlWeek, scmWeek);
}

onSnapshot(doc(db,'dagstaat','data'), snap => {
  rvdlDaysCache = snap.exists() ? (snap.data().days || {}) : {};
  setSync('ok','Live');
  combineAndRender();
}, err => setSync('err','Offline'));

(async () => {
  try {
    const snap = await getDocs(collection(db,'scm_urenstaten'));
    scmPostsCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
    combineAndRender();
  } catch(e) {
    console.warn('SCM urenstaten laden mislukt:', e);
    scmPostsCache = [];
    combineAndRender();
  }
})();

(async () => {
  try {
    const specsSnap = await getDocs(query(collection(db,'specs'), orderBy('verstuurd_datum','desc')));
    const specs = specsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    const wacht = specs.filter(s => !s.akkoord).length;
    const klaar = specs.filter(s => s.akkoord && !s.factuur_verstuurd).length;
    if (wacht > 0) {
      const b = document.getElementById('sideBadgeSpecs');
      b.style.display = 'inline-block';
      b.textContent = wacht;
    }
    if (klaar > 0) {
      const b = document.getElementById('sideBadgeFact');
      b.style.display = 'inline-block';
      b.textContent = klaar;
    }
  } catch(e) {
    console.warn('Specs laden mislukt:', e);
  }
})();
</script>
</body>
