<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1214">
<title>Ordinatio · Uren</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1214;
  --surface:#1a1f24;
  --surface-2:#242a30;
  --surface-3:#2d343b;
  --line:#2a3138;
  --line-2:#374049;
  --ink:#f5f7fa;
  --ink-2:#c6ccd4;
  --ink-3:#8892a0;
  --ink-4:#525a66;
  --rvdl:#4a90e2;
  --rvdl-soft:rgba(74,144,226,.14);
  --rvdl-line:rgba(74,144,226,.32);
  --scm:#4dabf7;
  --scm-soft:rgba(77,171,247,.14);
  --scm-line:rgba(77,171,247,.32);
  --scm-deep:#1a5490;
  --green:#51cf66;
  --green-soft:rgba(81,207,102,.14);
  --amber:#ffa94d;
  --amber-soft:rgba(255,169,77,.14);
  --red:#ff6b6b;
  --red-soft:rgba(255,107,107,.14);
  --r-lg:20px;
  --r:14px;
  --r-sm:10px;
  --r-xs:8px;
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11';
}

/* ═══ BEDRIJFSKEUZE OVERLAY ═══ */
.bedrijf-overlay{
  position:fixed;inset:0;background:var(--bg);
  z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
}
.bedrijf-header{text-align:center;margin-bottom:36px}
.bedrijf-header h1{
  font-family:'Fraunces',serif;font-weight:500;
  font-size:28px;color:var(--ink);letter-spacing:-0.02em;margin-bottom:6px;
}
.bedrijf-header p{font-size:14px;color:var(--ink-3)}
.bedrijf-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.bedrijf-btn{
  background:var(--surface);border:1px solid transparent;
  padding:22px 20px;border-radius:var(--r-lg);text-align:left;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:14px;
  transition:transform .12s,background .12s;
}
.bedrijf-btn:active{transform:scale(.98)}
.bedrijf-btn.rvdl{border-color:var(--rvdl-line);background:linear-gradient(160deg, rgba(74,144,226,0.15) 0%, rgba(74,144,226,0.05) 100%)}
.bedrijf-btn.scm{border-color:var(--scm-line);background:linear-gradient(160deg, rgba(77,171,247,0.14) 0%, rgba(26,84,144,0.22) 100%)}
.bedrijf-btn-icon{
  width:46px;height:46px;border-radius:12px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bedrijf-btn-icon svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bedrijf-btn-body{flex:1}
.bedrijf-btn-label{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px;
}
.bedrijf-btn-title{
  font-family:'Fraunces',serif;font-weight:600;
  font-size:19px;color:var(--ink);letter-spacing:-0.01em;
}

/* ═══ APP CONTAINER ═══ */
.app{
  max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 24px);
}

/* ═══ HEADER ═══ */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 14px;gap:10px;
}
.brand-block{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-icon.rvdl{background:var(--rvdl-soft);border:1px solid var(--rvdl-line)}
.brand-icon.scm{background:var(--scm-soft);border:1px solid var(--scm-line)}
.brand-icon svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{
  font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  color:var(--ink);letter-spacing:-0.01em;
}
.brand-sub{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;margin-top:1px}

/* ═══ TOP ACTIONS (UNIFORM) ═══ */
.top-actions{display:flex;gap:6px;flex-shrink:0}
.top-btn{
  min-width:38px;height:38px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:12px;font-weight:500;
  padding:0 10px;gap:6px;
  text-decoration:none;
  transition:background .12s;
}
.top-btn:active{background:var(--surface-2)}
.top-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-btn.sync-btn{color:var(--ink-3)}
.top-btn.sync-btn.ok{color:var(--green)}
.top-btn.sync-btn.err{color:var(--red)}
.top-btn.sync-btn.syncing svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ TABS ═══ */
.tabs{
  display:flex;gap:0;
  border-bottom:1px solid var(--line);margin-bottom:20px;
}
.tab{
  flex:1;background:none;border:none;color:var(--ink-3);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  padding:12px 0;position:relative;transition:color .12s;
}
.tab.on{color:var(--ink)}
.tab.on::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:2px;background:var(--rvdl);border-radius:2px;
}
body.scm-mode .tab.on::after{background:var(--scm)}

/* ═══ DATE STRIP ═══ */
.date-strip{
  display:grid;grid-template-columns:44px 1fr 44px;gap:8px;
  margin-bottom:16px;align-items:stretch;
}
.date-nav{
  width:44px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;
  font-size:22px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.date-nav:active{background:var(--surface-2)}

.date-current{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;min-width:0;
}
.date-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.date-big{
  font-family:'Fraunces',serif;font-weight:500;
  font-size:28px;line-height:1;color:var(--ink);flex-shrink:0;
}
.date-txt{min-width:0;flex:1;overflow:hidden}
.date-weekday{font-size:12px;font-weight:600;color:var(--rvdl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scm-mode .date-weekday{color:var(--scm)}
.date-month{font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-badge{
  font-size:10px;font-weight:600;
  background:var(--surface-2);color:var(--ink-3);
  padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.date-input-hidden{
  position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;
}

/* ═══ TOTAAL VANDAAG CARD ═══ */
.day-total{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.day-total-info{min-width:0;flex:1;overflow:hidden}
.day-total-label{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;
}
.day-total-sub{
  font-size:12px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.day-total-val{
  font-family:'JetBrains Mono',monospace;
  font-size:24px;font-weight:600;color:var(--ink);
  flex-shrink:0;
}

/* ═══ FORM CARD (blok) ═══ */
.form-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
.form-card-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.form-card-title-row{display:flex;align-items:center;gap:8px}
.form-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.form-card-title{
  font-size:14px;font-weight:600;color:var(--ink);
}
.remove-btn{
  background:none;border:none;color:var(--red);cursor:pointer;
  font-size:18px;line-height:1;padding:4px 8px;font-family:inherit;
}
.type-toggle{
  display:flex;gap:0;background:var(--surface-2);
  border-radius:20px;padding:3px;font-size:11px;margin-left:auto;margin-right:8px;
}
.type-toggle button{
  background:none;border:none;color:var(--ink-3);
  padding:5px 12px;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:11px;font-weight:600;
  transition:background .12s, color .12s;
}
.type-toggle button.on{background:var(--rvdl);color:#fff}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{
  font-size:10px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;
}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-xs);padding:12px 12px;
  color:var(--ink);font-family:inherit;font-size:15px;
  outline:none;transition:border-color .12s;
  -webkit-appearance:none;appearance:none;
  min-height:46px;width:100%;
  text-overflow:ellipsis;
}
.field input[type="time"],.field input[type="number"]{
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rvdl-line)}
body.scm-mode .field input:focus,body.scm-mode .field select:focus,body.scm-mode .field textarea:focus{border-color:var(--scm-line)}
.field select{
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238892a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;background-position:right 12px center;
  padding-right:36px;
}

/* KM TOGGLE ROW */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 4px;margin-top:6px;grid-column:1/-1;
  border-top:1px solid var(--line);
}
.toggle-label{font-size:13px;color:var(--ink-2);font-weight:500}
.toggle-sub{font-size:11px;color:var(--ink-4);margin-top:1px}
.toggle-switch{
  position:relative;width:44px;height:24px;
  background:var(--surface-3);border-radius:12px;cursor:pointer;
  border:none;transition:background .15s;padding:0;
  flex-shrink:0;
}
.toggle-switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;background:var(--ink-3);
  border-radius:50%;transition:transform .15s, background .15s;
}
.toggle-switch.on{background:var(--rvdl-soft)}
.toggle-switch.on::after{transform:translateX(20px);background:var(--rvdl)}
body.scm-mode .toggle-switch.on{background:var(--scm-soft)}
body.scm-mode .toggle-switch.on::after{background:var(--scm)}

/* NETTO ROW */
.netto-row{
  background:var(--green-soft);border:1px solid rgba(81,207,102,0.25);
  border-radius:var(--r-xs);padding:10px 14px;margin-top:12px;
  display:flex;justify-content:space-between;align-items:center;
}
.netto-row.warn{background:var(--amber-soft);border-color:rgba(255,169,77,0.25)}
.netto-label{font-size:12px;font-weight:500;color:var(--green)}
.netto-row.warn .netto-label{color:var(--amber)}
.netto-val{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:16px;color:var(--green);
}
.netto-row.warn .netto-val{color:var(--amber)}

/* ═══ BUTTONS ═══ */
.add-btn{
  width:100%;background:transparent;
  border:2px dashed var(--line-2);border-radius:var(--r);
  color:var(--ink-3);cursor:pointer;
  padding:16px;font-family:inherit;font-size:14px;font-weight:600;
  margin-bottom:14px;transition:border-color .12s, color .12s;
}
.add-btn:active{border-color:var(--rvdl);color:var(--rvdl)}
body.scm-mode .add-btn:active{border-color:var(--scm);color:var(--scm)}

.save-btn{
  width:100%;background:var(--rvdl);color:#fff;
  border:none;border-radius:var(--r);
  padding:16px;font-family:inherit;font-size:15px;font-weight:600;
  cursor:pointer;transition:opacity .12s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;
}
body.scm-mode .save-btn{background:var(--scm)}
.save-btn:active{opacity:0.85}
.save-btn:disabled{opacity:0.5;cursor:not-allowed}
.spin{
  display:none;width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
  border-radius:50%;animation:spin 0.7s linear infinite;
}
.save-btn.loading .spin{display:block}
.save-btn.loading span{opacity:0.7}

/* ═══ OVERZICHT ═══ */
.month-nav{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;
  margin-bottom:16px;align-items:stretch;
}
.month-title{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;text-align:center;
  font-family:'Fraunces',serif;font-weight:500;font-size:17px;color:var(--ink);
}

.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;
}
.stat{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 10px;text-align:center;
}
.stat-val{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:22px;color:var(--ink);line-height:1;
}
.stat-val.blue{color:var(--rvdl)}
.stat-val.green{color:var(--green)}
.stat-val.amber{color:var(--amber)}
.stat-lbl{
  font-size:10px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;
}

.section-title{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.1em;
  margin:20px 4px 10px;
}

.client-row{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
}
.client-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.client-info{flex:1;min-width:0}
.client-name{font-size:14px;font-weight:600;color:var(--ink)}
.client-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.client-hours{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:14px;color:var(--ink);white-space:nowrap;
}

.entry-row{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;
  display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;
  align-items:center;
}
.entry-date{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--ink-3);white-space:nowrap;
}
.entry-time{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--ink-2);white-space:nowrap;
}
.entry-klant{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-val{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:13px;color:var(--ink);white-space:nowrap;
}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--ink);
  padding:12px 20px;border-radius:var(--r);
  font-family:inherit;font-size:13px;font-weight:500;
  z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.4);
  border:1px solid var(--line);
  opacity:0;transition:opacity .2s;
  max-width:340px;text-align:center;
}
.toast.ok{border-color:rgba(81,207,102,.4);color:var(--green)}
.toast.bad{border-color:rgba(255,107,107,.4);color:var(--red)}

/* ═══ VERSION FOOTER ═══ */
.version-footer{
  margin-top:32px;padding-top:20px;
  border-top:1px solid var(--line);
  text-align:center;font-size:10px;color:var(--ink-4);
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body>

<!-- BEDRIJFSKEUZE OVERLAY -->
<div id="bedrijfsKeuze" class="bedrijf-overlay">
  <div class="bedrijf-header">
    <h1>Uren schrijven</h1>
    <p>Voor welk bedrijf?</p>
  </div>
  <div class="bedrijf-btns">
    <button onclick="kiesBedrijf('RvdL')" class="bedrijf-btn rvdl">
      <div class="bedrijf-btn-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </div>
      <div class="bedrijf-btn-body">
        <div class="bedrijf-btn-label">RvdL</div>
        <div class="bedrijf-btn-title">Dagstaat</div>
      </div>
    </button>
    <button onclick="kiesBedrijf('SCM')" class="bedrijf-btn scm">
      <div class="bedrijf-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="bedrijf-btn-body">
        <div class="bedrijf-btn-label">SCM</div>
        <div class="bedrijf-btn-title">Uren</div>
      </div>
    </button>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand-block">
      <div class="brand-icon" id="brandIcon">
        <svg viewBox="0 0 24 24" id="brandSvg"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </div>
      <div>
        <div class="brand-name" id="brandName">Dagstaat</div>
        <div class="brand-sub" id="brandSub">RvdL beheer</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="top-btn sync-btn syncing" id="syncBtn" onclick="manualSync()" title="Sync">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <a href="hub.html" class="top-btn" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <button class="top-btn" onclick="wisselBedrijf()" title="Wissel bedrijf">
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="rvdlTabs">
    <button class="tab on" onclick="switchTab('invoer',this)">Invoer</button>
    <button class="tab" onclick="switchTab('overzicht',this)">Overzicht</button>
  </div>

  <!-- INVOER PANE -->
  <div class="pane on" id="pane-invoer">
    <div class="date-strip">
      <button class="date-nav" onclick="changeDay(-1)">‹</button>
      <div class="date-current" onclick="document.getElementById('hiddenDate').showPicker?.()">
        <div class="date-left">
          <div class="date-big" id="dispDay">–</div>
          <div class="date-txt">
            <div class="date-weekday" id="dispWeekday">–</div>
            <div class="date-month" id="dispMonth">–</div>
          </div>
        </div>
        <div class="date-badge" id="dispCount">0 blokken</div>
      </div>
      <button class="date-nav" onclick="changeDay(1)">›</button>
    </div>
    <input type="date" id="hiddenDate" class="date-input-hidden" onchange="setDate(this.value)">

    <div class="day-total" id="dayTotalCard" style="display:none">
      <div class="day-total-info">
        <div class="day-total-label">Totaal vandaag</div>
        <div class="day-total-sub" id="dayTotalSub">–</div>
      </div>
      <div class="day-total-val" id="dayTotalVal">0:00</div>
    </div>

    <div id="entryForms"></div>

    <button class="add-btn" onclick="addBlock()">+ Tijdblok toevoegen</button>
    <button class="save-btn" id="saveBtn" onclick="saveDay()">
      <span>Dag opslaan</span>
      <div class="spin"></div>
    </button>
  </div>

  <!-- OVERZICHT PANE -->
  <div class="pane" id="pane-overzicht" style="display:none">
    <div class="month-nav">
      <button class="date-nav" onclick="prevMonth()">‹</button>
      <div class="month-title" id="monthTitle">–</div>
      <button class="date-nav" onclick="nextMonth()">›</button>
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-val blue" id="ov-days">0</div><div class="stat-lbl">Dagen</div></div>
      <div class="stat"><div class="stat-val green" id="ov-hours">0:00</div><div class="stat-lbl">Uren</div></div>
      <div class="stat"><div class="stat-val amber" id="ov-km">0</div><div class="stat-lbl">KM</div></div>
    </div>
    <div class="section-title">Per opdrachtgever</div>
    <div id="clientTotals"></div>
    <div class="section-title">Alle registraties</div>
    <div id="entriesTable"></div>
  </div>

  <!-- SCM SCREEN CONTAINER (wordt via JS gevuld) -->
  <div id="scmScreen" style="display:none"></div>

  <div class="version-footer">v73-layout-fix</div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,setDoc,getDoc,onSnapshot,collection,addDoc,query,orderBy,getDocs,deleteDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={apiKey:"AIzaSyBW4shtJ-2UlPMg1tHs3GUrNhfg6ocKxjY",authDomain:"dagstaat-ordinatio.firebaseapp.com",projectId:"dagstaat-ordinatio",storageBucket:"dagstaat-ordinatio.firebasestorage.app",messagingSenderId:"841107130686",appId:"1:841107130686:web:f91211f83a8e031746846f"};
const fbApp=initializeApp(FB);
const db=getFirestore(fbApp);

const MO=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MOS=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DYL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];

// Fallback klantenlijst (wordt vervangen door app_clients uit Firebase)
const KLANTEN_FALLBACK=['Intern','Sitech','Dysel','Seeder','HG','Nabuurs'];
const CC={Intern:'#5c6b7a',Sitech:'#4a90e2',Dysel:'#51cf66',Seeder:'#ffa94d',HG:'#c084fc',Nabuurs:'#ff6b6b'};

let huidigBedrijf=null;
const BEDRIJF_KEY='dagstaat_bedrijf_v1';

// State
let days={},activeDate=todayISO(),vMonth=new Date().getMonth(),vYear=new Date().getFullYear();
let blocks=[];
let appClients=[]; // Klanten uit Firebase app_clients

// ═══ BEDRIJFSKEUZE ═══
function bootBedrijfsKeuze(){
  const urlParams=new URLSearchParams(location.search);
  const urlBedrijf=urlParams.get('bedrijf');
  if(urlBedrijf==='RvdL'||urlBedrijf==='SCM'){
    huidigBedrijf=urlBedrijf;
    sessionStorage.setItem(BEDRIJF_KEY,urlBedrijf);
    document.getElementById('bedrijfsKeuze').style.display='none';
    document.getElementById('mainApp').style.display='';
    onBedrijfActief();
    return;
  }
  const opgeslagen=sessionStorage.getItem(BEDRIJF_KEY);
  if(opgeslagen==='RvdL'||opgeslagen==='SCM'){
    huidigBedrijf=opgeslagen;
    document.getElementById('bedrijfsKeuze').style.display='none';
    document.getElementById('mainApp').style.display='';
    onBedrijfActief();
  } else {
    document.getElementById('bedrijfsKeuze').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
}

window.kiesBedrijf=function(bedrijf){
  huidigBedrijf=bedrijf;
  sessionStorage.setItem(BEDRIJF_KEY,bedrijf);
  document.getElementById('bedrijfsKeuze').style.display='none';
  document.getElementById('mainApp').style.display='';
  onBedrijfActief();
};

window.wisselBedrijf=function(){
  sessionStorage.removeItem(BEDRIJF_KEY);
  huidigBedrijf=null;
  if(document.referrer&&document.referrer.includes('hub.html')){
    location.href='hub.html';
  } else {
    location.href=location.pathname;
  }
};

function onBedrijfActief(){
  const brandIcon=document.getElementById('brandIcon');
  const brandName=document.getElementById('brandName');
  const brandSub=document.getElementById('brandSub');
  if(huidigBedrijf==='RvdL'){
    brandIcon.className='brand-icon rvdl';
    brandName.textContent='Dagstaat';
    brandSub.textContent='RvdL beheer';
    document.body.classList.remove('scm-mode');
    document.getElementById('pane-invoer').style.display='';
    document.getElementById('pane-overzicht').style.display='none';
    document.getElementById('rvdlTabs').style.display='';
    document.getElementById('scmScreen').style.display='none';
    // Klanten laden en initialiseren
    loadAppClients().then(()=>init());
  } else if(huidigBedrijf==='SCM'){
    brandIcon.className='brand-icon scm';
    brandName.textContent='Uren';
    brandSub.textContent='Supply Chain Meneer';
    document.body.classList.add('scm-mode');
    document.getElementById('rvdlTabs').style.display='none';
    document.getElementById('pane-invoer').style.display='none';
    document.getElementById('pane-overzicht').style.display='none';
    document.getElementById('scmScreen').style.display='';
    toonSCMModus();
  }
}

// ═══ HELPERS ═══
function todayISO(){const n=new Date();return`${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}`}
function p2(n){return String(n).padStart(2,'0')}
function m2s(m){return`${Math.floor(m/60)}:${p2(m%60)}`}
function tMins(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m}
function bMins(b){
  if(b.type==='dag'){return Math.round((Number(b.dagen)||0)*480)}
  return Math.max(0,(tMins(b.end)-tMins(b.start))-(parseInt(b.brk)||0));
}
function cc(n){
  const c=appClients.find(x=>x.name===n);
  if(c&&c.color)return c.color;
  return CC[n]||'#8892a0';
}
function isoD(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}

function klantList(){
  if(appClients.length>0)return appClients.map(c=>c.name);
  return KLANTEN_FALLBACK;
}

function klantByName(name){
  return appClients.find(c=>c.name===name);
}

// ═══ SYNC ═══
function syncStatus(s,t){
  const btn=document.getElementById('syncBtn');
  if(!btn)return;
  btn.className='top-btn sync-btn '+(s==='synced'?'ok':s==='offline'?'err':'syncing');
  btn.title=t;
}

// ═══ APP CLIENTS LADEN ═══
async function loadAppClients(){
  try{
    const snap=await getDoc(doc(db,'app_clients','main'));
    if(snap.exists()){
      const d=snap.data();
      appClients=Array.isArray(d.clients)?d.clients:[];
    } else {
      // Fallback naar localStorage
      const local=localStorage.getItem('dgs_clients_v1');
      appClients=local?JSON.parse(local):[];
    }
  }catch(e){
    console.warn('app_clients laden mislukt:',e);
    appClients=[];
  }
}

// ═══ FIREBASE SNAPSHOT ═══
onSnapshot(doc(db,'dagstaat','data'),(snap)=>{
  if(snap.exists()){
    days=snap.data().days||{};
    if(huidigBedrijf==='RvdL'){
      renderOverzicht();
      loadDayBlocks();
    }
  }
  syncStatus('synced','Gesynchroniseerd');
},(err)=>{syncStatus('offline','Offline')});

async function saveToFB(){
  syncStatus('syncing','Opslaan…');
  try{
    await setDoc(doc(db,'dagstaat','data'),{days});
    syncStatus('synced','Gesynchroniseerd');
  }catch(e){
    syncStatus('offline','Offline');
    showToast('Fout: '+e.message,'bad');
  }
}

window.manualSync=async function(){
  syncStatus('syncing','Synchroniseren…');
  try{
    const s=await getDoc(doc(db,'dagstaat','data'));
    if(s.exists())days=s.data().days||{};
    await loadAppClients();
    if(huidigBedrijf==='RvdL'){renderOverzicht();loadDayBlocks();}
    syncStatus('synced','Gesynchroniseerd');
    showToast('Gesynchroniseerd ✓','ok');
  }catch(e){syncStatus('offline','Offline');}
};

// ═══ INIT ═══
function init(){
  document.getElementById('hiddenDate').value=activeDate;
  setDate(activeDate);
}

window.setDate=function(iso){
  activeDate=iso;
  document.getElementById('hiddenDate').value=iso;
  const d=isoD(iso);
  document.getElementById('dispDay').textContent=d.getDate();
  document.getElementById('dispWeekday').textContent=DYL[d.getDay()];
  document.getElementById('dispMonth').textContent=`${MO[d.getMonth()]} ${d.getFullYear()}`;
  loadDayBlocks();
};

window.changeDay=function(delta){
  const d=isoD(activeDate);d.setDate(d.getDate()+delta);
  setDate(`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`);
};

function loadDayBlocks(){
  const dayBlocks=days[activeDate]||[];
  if(dayBlocks.length>0){
    blocks=dayBlocks.map(b=>({...b}));
  } else {
    // Default blok — kies eerste klant of Sitech
    const firstKlant=klantList()[0]||'Sitech';
    blocks=[{klant:firstKlant,start:'08:00',end:'16:30',brk:30,km:0,km_on:false,type:'uur'}];
  }
  renderBlocks();
}

// ═══ BLOCK RENDER ═══
function renderBlocks(){
  const c=document.getElementById('entryForms');
  c.innerHTML='';
  blocks.forEach((b,i)=>c.appendChild(mkBlock(b,i)));
  updateTotal();
  const n=days[activeDate]?.length||0;
  document.getElementById('dispCount').textContent=`${n} blok${n!==1?'ken':''}`;
}

function mkBlock(b,i){
  const d=document.createElement('div');
  d.className='form-card';
  const m=bMins(b);
  const klantOpties=klantList();
  const klantHtml=klantOpties.map(k=>`<option${k===b.klant?' selected':''}>${k}</option>`).join('');

  // Bepaal of deze klant per-dag factureert
  const klant=klantByName(b.klant);
  const kanDagInvoer=klant&&klant.factuur_per_dag===true;
  // Als klant per dag is en type niet gezet: default naar 'dag'
  if(kanDagInvoer&&!b.type){b.type='dag';if(!b.dagen)b.dagen=1;}
  if(!b.type)b.type='uur';

  // Type toggle: alleen zichtbaar als klant per dag kan
  const typeToggleHtml=kanDagInvoer?`<div class="type-toggle">
    <button class="${b.type==='uur'?'on':''}" onclick="updBlockType(${i},'uur')">Uren</button>
    <button class="${b.type==='dag'?'on':''}" onclick="updBlockType(${i},'dag')">Dagen</button>
  </div>`:'';

  // Uren-velden of dag-veld
  const invoerHtml=b.type==='dag'?`
    <div class="field full">
      <label>Aantal dagen</label>
      <input type="number" value="${b.dagen||1}" step="0.5" min="0" max="7" onchange="updBlock(${i},'dagen',this.value)">
    </div>`:`
    <div class="field"><label>Starttijd</label><input type="time" value="${b.start||'08:00'}" step="300" onchange="updBlock(${i},'start',this.value)"></div>
    <div class="field"><label>Eindtijd</label><input type="time" value="${b.end||'16:30'}" step="300" onchange="updBlock(${i},'end',this.value)"></div>
    <div class="field"><label>Pauze (min)</label><input type="number" value="${b.brk||0}" min="0" max="240" onchange="updBlock(${i},'brk',this.value)"></div>`;

  // KM toggle en veld
  const kmOn=!!b.km_on;
  const kmVeldHtml=kmOn?`<div class="field full" style="margin-top:6px">
    <label>Kilometers</label>
    <input type="number" value="${b.km||''}" min="0" max="9999" placeholder="0" onchange="updBlock(${i},'km',this.value)">
  </div>`:'';

  d.innerHTML=`
    <div class="form-card-header">
      <div class="form-card-title-row">
        <div class="form-dot" style="background:${cc(b.klant)}" id="dot-${i}"></div>
        <span class="form-card-title">Blok ${i+1}</span>
      </div>
      ${typeToggleHtml}
      ${blocks.length>1?`<button class="remove-btn" onclick="removeBlock(${i})">✕</button>`:''}
    </div>
    <div class="fg">
      <div class="field full">
        <label>Opdrachtgever</label>
        <select onchange="updBlock(${i},'klant',this.value)">${klantHtml}</select>
      </div>
      ${invoerHtml}
      <div class="toggle-row">
        <div>
          <div class="toggle-label">KM-vergoeding</div>
          <div class="toggle-sub">${kmOn?'Aan — km worden meegenomen':'Uit — geen km deze dag'}</div>
        </div>
        <button class="toggle-switch ${kmOn?'on':''}" onclick="toggleKm(${i})"></button>
      </div>
      ${kmVeldHtml}
    </div>
    <div class="netto-row${m>0?'':' warn'}" id="nr-${i}">
      <span class="netto-label">Netto ${b.type==='dag'?'':'uren'}</span>
      <span class="netto-val">${m>0?(b.type==='dag'?`${b.dagen||1} dag${(b.dagen||1)>1?'en':''}`:m2s(m)):'–'}</span>
    </div>`;
  return d;
}

window.updBlock=function(i,k,v){
  if(k==='brk'||k==='km')blocks[i][k]=parseInt(v)||0;
  else if(k==='dagen')blocks[i][k]=parseFloat(v)||0;
  else blocks[i][k]=v;

  // Als klant wijzigt, check per-dag optie
  if(k==='klant'){
    const dot=document.getElementById(`dot-${i}`);
    if(dot)dot.style.background=cc(v);
    const klant=klantByName(v);
    if(klant&&klant.factuur_per_dag===true){
      blocks[i].type='dag';
      if(!blocks[i].dagen)blocks[i].dagen=1;
    } else {
      blocks[i].type='uur';
    }
    renderBlocks();
    return;
  }

  updateBlockDisplay(i);
  updateTotal();
};

window.updBlockType=function(i,t){
  blocks[i].type=t;
  if(t==='dag'&&!blocks[i].dagen)blocks[i].dagen=1;
  renderBlocks();
};

window.toggleKm=function(i){
  blocks[i].km_on=!blocks[i].km_on;
  if(!blocks[i].km_on)blocks[i].km=0;
  renderBlocks();
};

function updateBlockDisplay(i){
  const nr=document.getElementById(`nr-${i}`);
  if(!nr)return;
  const b=blocks[i];
  const m=bMins(b);
  nr.className=`netto-row${m>0?'':' warn'}`;
  nr.querySelector('.netto-val').textContent=m>0?(b.type==='dag'?`${b.dagen||1} dag${(b.dagen||1)>1?'en':''}`:m2s(m)):'–';
}

window.addBlock=function(){
  const firstKlant=klantList()[0]||'Sitech';
  const klant=klantByName(firstKlant);
  const isDag=klant&&klant.factuur_per_dag===true;
  blocks.push({
    klant:firstKlant,
    type:isDag?'dag':'uur',
    start:'08:00',end:'16:30',brk:30,
    dagen:isDag?1:undefined,
    km:0,km_on:false
  });
  renderBlocks();
};

window.removeBlock=function(i){
  if(blocks.length<=1)return;
  blocks.splice(i,1);
  renderBlocks();
};

function updateTotal(){
  const t=blocks.reduce((s,b)=>s+bMins(b),0);
  const card=document.getElementById('dayTotalCard');
  if(t>0){
    card.style.display='';
    document.getElementById('dayTotalVal').textContent=m2s(t);
    const klanten=[...new Set(blocks.filter(b=>bMins(b)>0).map(b=>b.klant))];
    document.getElementById('dayTotalSub').textContent=klanten.join(' · ');
  } else {
    card.style.display='none';
  }
}

window.saveDay=async function(){
  const v=blocks.filter(b=>bMins(b)>0);
  if(!v.length){showToast('Voer geldige tijden of dagen in','bad');return;}
  const btn=document.getElementById('saveBtn');
  btn.classList.add('loading');btn.disabled=true;
  days[activeDate]=v.map(b=>{
    const clean={klant:b.klant,type:b.type||'uur'};
    if(b.type==='dag'){
      clean.dagen=Number(b.dagen)||0;
    } else {
      clean.start=b.start;clean.end=b.end;clean.brk=parseInt(b.brk)||0;
    }
    clean.km=b.km_on?(parseInt(b.km)||0):0;
    clean.km_on=!!b.km_on;
    return clean;
  });
  await saveToFB();
  const n=days[activeDate].length;
  document.getElementById('dispCount').textContent=`${n} blok${n!==1?'ken':''}`;
  btn.classList.remove('loading');btn.disabled=false;
  showToast(`${n} blok${n!==1?'ken':''} opgeslagen ✓`,'ok');
};

// ═══ TABS ═══
window.switchTab=function(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pane-invoer').style.display=name==='invoer'?'':'none';
  document.getElementById('pane-overzicht').style.display=name==='overzicht'?'':'none';
  if(name==='overzicht'){
    vMonth=new Date().getMonth();vYear=new Date().getFullYear();
    renderOverzicht();
  }
};

window.prevMonth=function(){vMonth--;if(vMonth<0){vMonth=11;vYear--}renderOverzicht()};
window.nextMonth=function(){vMonth++;if(vMonth>11){vMonth=0;vYear++}renderOverzicht()};

function renderOverzicht(){
  const pfx=`${vYear}-${p2(vMonth+1)}`;
  document.getElementById('monthTitle').textContent=`${MO[vMonth]} ${vYear}`;
  const mDays=Object.keys(days).filter(d=>d.startsWith(pfx)).sort();
  const all=mDays.flatMap(k=>days[k].map(b=>({...b,date:k})));
  const tMin=all.reduce((s,b)=>s+bMins(b),0);
  const tKm=all.reduce((s,b)=>s+(b.km||0),0);
  document.getElementById('ov-days').textContent=mDays.length;
  document.getElementById('ov-hours').textContent=m2s(tMin);
  document.getElementById('ov-km').textContent=tKm;

  const map={};
  all.forEach(b=>{
    if(!map[b.klant])map[b.klant]={mins:0,days:new Set(),km:0};
    map[b.klant].mins+=bMins(b);
    map[b.klant].days.add(b.date);
    map[b.klant].km+=b.km||0;
  });
  const clientEl=document.getElementById('clientTotals');
  clientEl.innerHTML=Object.entries(map).sort((a,b)=>b[1].mins-a[1].mins).map(([k,v])=>`
    <div class="client-row">
      <div class="client-dot" style="background:${cc(k)}"></div>
      <div class="client-info">
        <div class="client-name">${k}</div>
        <div class="client-sub">${v.days.size} dag${v.days.size!==1?'en':''}${v.km>0?` · ${v.km} km`:''}</div>
      </div>
      <div class="client-hours">${m2s(v.mins)}</div>
    </div>`).join('')||'<div style="color:var(--ink-3);font-size:13px;text-align:center;padding:20px">Geen registraties deze maand</div>';

  const entriesEl=document.getElementById('entriesTable');
  entriesEl.innerHTML=all.sort((a,b)=>b.date.localeCompare(a.date)).map(b=>{
    const d=isoD(b.date);
    const dayLbl=`${DYL[d.getDay()].slice(0,2)} ${d.getDate()}/${d.getMonth()+1}`;
    const timeLbl=b.type==='dag'?`${b.dagen||1}d`:`${b.start||'--'}-${b.end||'--'}`;
    return`<div class="entry-row">
      <div class="entry-date">${dayLbl}</div>
      <div class="entry-time">${timeLbl}</div>
      <div class="entry-klant">${b.klant}</div>
      <div class="entry-val">${m2s(bMins(b))}</div>
    </div>`;
  }).join('')||'<div style="color:var(--ink-3);font-size:13px;text-align:center;padding:20px">Geen registraties</div>';
}

// ═══ TOAST ═══
function showToast(msg,type){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast';el.className='toast';
    document.body.appendChild(el);
  }
  el.className='toast '+(type||'');
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(el._to);
  el._to=setTimeout(()=>{el.style.opacity='0';},2500);
}

// ═══════════════════════════════════════
// SCM MODUS
// ═══════════════════════════════════════
let scmProjecten=[];
let scmConsultants=[];
let scmUrenPosten=[];
let scmActiefProject=null;

async function loadScmProjecten(){
  try{
    const snap=await getDocs(collection(db,'scm_projecten'));
    scmProjecten=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(p=>(p.status||'actief')==='actief')
      .sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  }catch(e){scmProjecten=[];}
}

async function loadScmConsultants(){
  try{
    const snap=await getDocs(collection(db,'scm_consultants'));
    scmConsultants=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  }catch(e){scmConsultants=[];}
}

async function loadScmUrenVoorProject(projectId){
  try{
    const snap=await getDocs(collection(db,'scm_urenstaten'));
    scmUrenPosten=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(p=>p.project_id===projectId)
      .sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  }catch(e){scmUrenPosten=[];}
}

async function toonSCMModus(){
  const scr=document.getElementById('scmScreen');
  scr.innerHTML='<div style="text-align:center;padding:40px;color:var(--ink-3);font-size:14px">Projecten laden…</div>';
  syncStatus('syncing','Projecten laden…');
  await loadScmProjecten();
  await loadScmConsultants();
  syncStatus('synced','Gesynchroniseerd');
  renderSCMProjectKeuze();
}

function renderSCMProjectKeuze(){
  const scr=document.getElementById('scmScreen');
  if(scmProjecten.length===0){
    scr.innerHTML=`<div style="text-align:center;padding:50px 20px">
      <div style="font-size:44px;margin-bottom:14px;opacity:0.4">–</div>
      <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:8px">Geen actieve projecten</div>
      <div style="font-size:13px;color:var(--ink-3);line-height:1.5">Maak eerst een project aan in de SCM-app onder <strong>Projecten</strong>.</div>
    </div>`;
    return;
  }
  const projectOptions=scmProjecten.map(p=>{
    const tarief=p.tarieftype==='uur'?'per uur':p.tarieftype==='dag'?'per dag':'vast bedrag';
    return`<option value="${p.id}">${p.nummer||''} · ${p.naam||'(geen naam)'} (${tarief})</option>`;
  }).join('');
  scr.innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <label style="display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);margin-bottom:8px">Kies project</label>
      <select id="scmProjectSelect" onchange="scmProjectGekozen(this.value)" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-xs);padding:14px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238892a0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;padding-right:38px">
        <option value="">— Selecteer een project —</option>
        ${projectOptions}
      </select>
    </div>
    <div id="scmProjectDetail"></div>`;
  if(scmActiefProject&&scmProjecten.some(p=>p.id===scmActiefProject)){
    document.getElementById('scmProjectSelect').value=scmActiefProject;
    scmProjectGekozen(scmActiefProject);
  }
}

window.scmProjectGekozen=async function(projectId){
  scmActiefProject=projectId||null;
  const detail=document.getElementById('scmProjectDetail');
  if(!projectId){detail.innerHTML='';return;}
  const project=scmProjecten.find(p=>p.id===projectId);
  if(!project){detail.innerHTML='';return;}
  detail.innerHTML='<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px">Uren laden…</div>';
  await loadScmUrenVoorProject(projectId);
  renderSCMInvoer(project);
};

function renderSCMInvoer(project){
  const detail=document.getElementById('scmProjectDetail');
  const isDag=project.tarieftype==='dag';
  const eenheid=isDag?'Dagen':'Uren';
  const verplichtLabel=project.verantwoording_verplicht
    ?'<span style="color:var(--red)">*verplicht</span>'
    :'<span style="color:var(--ink-3)">(optioneel)</span>';
  const klantNaam=project.klant_naam||'(geen klant)';
  const tariefTxt=project.tarieftype==='uur'?`€ ${(project.tarief||0).toFixed(2)}/u`
    :project.tarieftype==='dag'?`€ ${(project.tarief||0).toFixed(2)}/dag`
    :`€ ${(project.totaal||0).toFixed(2)} totaal`;

  // Consultants dropdown
  const gekoppeld=Array.isArray(project.consultant_ids)?project.consultant_ids:[];
  const beschikbaar=scmConsultants.filter(c=>gekoppeld.includes(c.id));
  let consultantHtml='';
  if(beschikbaar.length===0){
    consultantHtml=`<div style="margin-bottom:12px;padding:10px 12px;background:var(--amber-soft);border:1px solid rgba(255,169,77,0.25);border-radius:var(--r-xs);font-size:12px;color:var(--amber)">⚠️ Geen consultants aan dit project gekoppeld. Voeg ze toe via SCM → Projecten → Wijzigen.</div>`;
  } else {
    consultantHtml=`<div class="field full" style="margin-bottom:12px">
      <label>Consultant *</label>
      <select id="scmConsultant" style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-xs);padding:14px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%238892a0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;padding-right:38px">
        ${beschikbaar.length===1?'':'<option value="">— Kies —</option>'}
        ${beschikbaar.map(c=>`<option value="${c.id}"${beschikbaar.length===1?' selected':''}>${c.naam||'(geen naam)'}</option>`).join('')}
      </select>
    </div>`;
  }

  // Week groepering
  const perWeek={};
  scmUrenPosten.forEach(post=>{
    const d=new Date(post.datum);
    const wk=getISOWeek(d);
    const key=`${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
    if(!perWeek[key])perWeek[key]={label:key,weekNr:wk,jaar:d.getFullYear(),posts:[],totaal:0};
    perWeek[key].posts.push(post);
    perWeek[key].totaal+=Number(post.aantal||0);
  });
  const weken=Object.values(perWeek).sort((a,b)=>b.label.localeCompare(a.label));

  const wekenHTML=weken.length===0
    ?'<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px">Nog geen uren geschreven.</div>'
    :weken.map(w=>{
      const postsHTML=w.posts.map(p=>{
        const gefactureerd=!!p.gefactureerd;
        return`<div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:13px">
          <div style="min-width:0;flex:1">
            <div style="font-weight:600;color:var(--ink);font-size:13px">${formatDatumKort(p.datum)}${p.consultant_naam?` <span style="color:var(--ink-3);font-weight:400;font-size:11px">${p.consultant_naam}</span>`:''}</div>
            ${p.verantwoording?`<div style="font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4">${escapeHTML(p.verantwoording)}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--ink)">${p.aantal} ${isDag?'d':'u'}</div>
            ${gefactureerd?'<div style="font-size:9px;color:var(--green);margin-top:2px">✓ gefactureerd</div>':`<button onclick="scmVerwijderPost('${p.id}')" style="background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;padding:2px 0;margin-top:2px;font-family:inherit">verwijderen</button>`}
          </div>
        </div>`;
      }).join('');
      return`<div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden">
        <div style="padding:10px 12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)">
          <div style="font-weight:600;font-size:12px;color:var(--ink)">Week ${w.weekNr} · ${w.jaar}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink)">${w.totaal} ${isDag?'d':'u'}</div>
        </div>
        ${postsHTML}
      </div>`;
    }).join('');

  detail.innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);margin-bottom:4px">Project</div>
      <div style="font-family:'Fraunces',serif;font-size:17px;color:var(--ink);line-height:1.3">${escapeHTML(project.naam)}</div>
      <div style="font-size:12px;color:var(--ink-2);margin-top:4px">${escapeHTML(klantNaam)}</div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:4px">${tariefTxt}</div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);margin-bottom:12px">Nieuwe post</div>
      ${consultantHtml}
      <div class="fg" style="margin-bottom:12px">
        <div class="field"><label>Datum</label><input type="date" id="scmDatum" value="${todayISO()}"></div>
        <div class="field"><label>${eenheid}</label><input type="number" id="scmAantal" step="${isDag?'0.5':'0.25'}" min="0" placeholder="${isDag?'1':'8'}"></div>
      </div>
      ${project.km_on?`<div class="field full" style="margin-bottom:12px"><label>Kilometers (optioneel)</label><input type="number" id="scmKm" step="1" min="0" placeholder="0"></div>`:''}
      <div class="field full" style="margin-bottom:14px">
        <label>Verantwoording ${verplichtLabel}</label>
        <textarea id="scmVerantwoording" rows="2" placeholder="Wat heb je gedaan?" style="resize:vertical;line-height:1.4;font-size:14px"></textarea>
      </div>
      <button onclick="scmOpslaanPost()" class="save-btn" style="min-height:48px"><span>+ Toevoegen</span></button>
    </div>

    <div class="section-title">Geschreven ${eenheid.toLowerCase()}</div>
    ${wekenHTML}
  `;
}

window.scmOpslaanPost=async function(){
  const project=scmProjecten.find(p=>p.id===scmActiefProject);
  if(!project){showToast('Geen project geselecteerd','bad');return;}
  const datum=document.getElementById('scmDatum').value;
  const aantal=parseFloat(document.getElementById('scmAantal').value);
  const km=document.getElementById('scmKm')?(parseFloat(document.getElementById('scmKm').value)||0):0;
  const verantwoording=document.getElementById('scmVerantwoording').value.trim();
  const consEl=document.getElementById('scmConsultant');
  const consultantId=consEl?consEl.value:'';
  const consultant=consultantId?scmConsultants.find(c=>c.id===consultantId):null;

  if(!datum){showToast('Kies datum','bad');return;}
  if(!aantal||aantal<=0){showToast('Vul aantal in','bad');return;}
  if(!consultantId&&consEl){showToast('Kies consultant','bad');return;}
  if(project.verantwoording_verplicht&&!verantwoording){showToast('Verantwoording verplicht','bad');return;}

  syncStatus('syncing','Opslaan…');
  try{
    await addDoc(collection(db,'scm_urenstaten'),{
      project_id:project.id,project_nummer:project.nummer||'',project_naam:project.naam||'',
      klant_naam:project.klant_naam||'',
      consultant_id:consultantId||null,consultant_naam:consultant?consultant.naam:'',
      datum,aantal,eenheid:project.tarieftype==='dag'?'dag':'uur',
      tarief_snapshot:project.tarief||0,
      km,km_tarief_snapshot:project.km_on?(project.km_tarief||0.21):0,
      verantwoording,gefactureerd:false,
      aangemaakt:new Date().toISOString()
    });
    syncStatus('synced','Gesynchroniseerd');
    showToast('Post toegevoegd ✓','ok');
    await loadScmUrenVoorProject(project.id);
    renderSCMInvoer(project);
  }catch(e){
    syncStatus('offline','Offline');
    showToast('Fout: '+e.message,'bad');
  }
};

window.scmVerwijderPost=async function(postId){
  const post=scmUrenPosten.find(p=>p.id===postId);
  if(post&&post.gefactureerd){showToast('Gefactureerd — niet verwijderbaar','bad');return;}
  if(!confirm('Deze urenpost verwijderen?'))return;
  const project=scmProjecten.find(p=>p.id===scmActiefProject);
  syncStatus('syncing','Verwijderen…');
  try{
    await deleteDoc(doc(db,'scm_urenstaten',postId));
    syncStatus('synced','Gesynchroniseerd');
    showToast('Verwijderd','ok');
    if(project){await loadScmUrenVoorProject(project.id);renderSCMInvoer(project);}
  }catch(e){
    syncStatus('offline','Offline');
    showToast('Fout: '+e.message,'bad');
  }
};

function getISOWeek(d){
  const target=new Date(d.valueOf());
  const dayNr=(d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday=new Date(target.getFullYear(),0,4);
  const diff=target-firstThursday;
  return 1+Math.round(((diff/86400000)-3+((firstThursday.getDay()+6)%7))/7);
}
function formatDatumKort(iso){
  if(!iso)return'';
  const d=new Date(iso);
  return`${DYL[d.getDay()].slice(0,2)} ${d.getDate()} ${MOS[d.getMonth()]}`;
}
function escapeHTML(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══ BOOTSTRAP ═══
bootBedrijfsKeuze();
</script>
