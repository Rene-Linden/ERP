// SCM bedrijfsgegevens
const SCM={
  naam:"Supply Chain Meneer B.V.",
  locatie:"'s-Hertogenbosch, Nederland",
  email:"info@supplychainmeneer.nl",
  telefoon:"+31 6 240 88 900",
  kvk:"17216997",
  btw:"NL1480.32.898.B01",
  iban:"NL67 RABO 0142 1412 91"
};

const MO=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function fmtDatum(iso){if(!iso)return'–';const d=new Date(iso);return d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();}
function euro(n){return'€ '+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function renderOfferte(o){
  const k=o.klant_data||{};
  const geldigTot=o.geldig_tot?fmtDatum(o.geldig_tot):'–';
  const regelsHTML=(o.regels||[]).map(r=>`<tr>
    <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2">${esc(r.omschrijving)}</td>
    <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;text-align:right;font-family:monospace">${euro(r.bedrag)}</td>
  </tr>`).join('');

  return `<div style="max-width:730px;margin:0 auto;font-family:Arial,sans-serif;font-size:11px;color:#1a1a18;line-height:1.4;position:relative;min-height:26cm;padding-bottom:80px;box-sizing:border-box">

    <!-- HEADER -->
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
      <tr>
        <td style="vertical-align:top;width:35%">
          <img src="${LOGO_URL}" alt="Supply Chain Meneer" style="width:110px;height:auto;display:block">
        </td>
        <td style="vertical-align:top;text-align:right;line-height:1.5;font-size:11px;color:#4a4a46">
          <div style="font-weight:700;color:#1a1a18;font-size:13px">${SCM.naam}</div>
          <div>${SCM.locatie}</div>
          <div>${SCM.email}</div>
          <div>${SCM.telefoon}</div>
          <div>KvK: ${SCM.kvk}</div>
          <div>IBAN: ${SCM.iban}</div>
        </td>
      </tr>
    </table>

    <!-- KLANT + OFFERTE INFO -->
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e8e7e2">
      <tr>
        <td style="vertical-align:top;font-size:11px;line-height:1.5">
          <div style="font-weight:700;font-size:12px">${esc(o.klant_naam)}</div>
          ${k.contact?`<div>T.a.v. ${esc(k.contact)}</div>`:''}
          ${k.address?`<div>${esc(k.address)}</div>`:''}
          ${k.city?`<div>${esc(k.city)}</div>`:''}
        </td>
      </tr>
    </table>

    <!-- OFFERTE TITEL -->
    <div style="background:#e6ecf3;border:1px solid #a3b9d4;border-radius:6px;padding:10px 14px;margin-bottom:14px">
      <div style="font-size:16px;font-weight:700;color:#003366;margin-bottom:6px">OFFERTE</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <td style="padding:2px 0;color:#8a8a84;width:120px">Offertenummer:</td>
          <td style="font-weight:600;font-family:monospace;width:35%">${esc(o.nummer)}</td>
          <td style="padding:2px 0;color:#8a8a84;width:120px">Datum:</td>
          <td>${fmtDatum(o.datum)}</td>
        </tr>
        <tr>
          <td style="padding:2px 0;color:#8a8a84">Onderwerp:</td>
          <td>${esc(o.titel)}</td>
          <td style="padding:2px 0;color:#8a8a84">Geldig tot:</td>
          <td>${geldigTot}</td>
        </tr>
      </table>
    </div>

    <!-- OMSCHRIJVING -->
    ${o.omschrijving?`
    <div style="margin-bottom:14px">
      <div style="border-bottom:2px solid #003366;padding-bottom:3px;margin-bottom:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#003366">Omschrijving werkzaamheden</div>
      <div style="font-size:11px;line-height:1.6">${esc(o.omschrijving)}</div>
    </div>`:''}

    <!-- REGELS + TOTALEN -->
    <div style="margin-bottom:14px">
      <div style="border-bottom:2px solid #003366;padding-bottom:3px;margin-bottom:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#003366">Overzicht</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d4d3cc">
        <thead>
          <tr style="background:#003366;color:white">
            <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600">Omschrijving</th>
            <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;width:130px">Bedrag</th>
          </tr>
        </thead>
        <tbody>${regelsHTML}</tbody>
      </table>
    </div>

    <!-- TOTALEN -->
    <div style="margin-left:auto;width:60%;margin-bottom:14px">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <td style="padding:5px 10px;color:#4a4a46;text-align:right">Subtotaal excl. BTW:</td>
          <td style="padding:5px 10px;text-align:right;font-family:monospace;width:120px">${euro(o.totaal_excl)}</td>
        </tr>
        <tr>
          <td style="padding:5px 10px;color:#4a4a46;text-align:right">BTW ${o.btw_pct}%:</td>
          <td style="padding:5px 10px;text-align:right;font-family:monospace">${euro(o.btw_bedrag)}</td>
        </tr>
        <tr style="border-top:2px solid #003366;font-weight:700;font-size:12px;background:#e6ecf3">
          <td style="padding:8px 10px;text-align:right;color:#003366">Totaal incl. BTW:</td>
          <td style="padding:8px 10px;text-align:right;font-family:monospace;color:#003366">${euro(o.totaal_incl)}</td>
        </tr>
      </table>
    </div>

    <!-- VOORWAARDEN -->
    ${o.voorwaarden?`
    <div style="margin-bottom:14px">
      <div style="border-bottom:2px solid #003366;padding-bottom:3px;margin-bottom:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#003366">Voorwaarden</div>
      <div style="font-size:11px;line-height:1.6">${esc(o.voorwaarden)}</div>
    </div>`:''}

    <!-- ONDERTEKENING -->
    <div style="margin-top:24px;padding:14px;background:#f8f7f4;border:1px solid #e8e7e2;border-radius:6px">
      <div style="font-size:12px;font-weight:600;margin-bottom:12px;color:#003366">Akkoord voor deze offerte</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <td style="width:50%;padding-right:16px;vertical-align:top">
            <div style="color:#8a8a84;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Namens ${esc(o.klant_naam)}</div>
            <div style="border-bottom:1px solid #4a4a46;height:36px"></div>
            <div style="font-size:10px;color:#8a8a84;margin-top:4px">Naam + handtekening</div>
            <div style="margin-top:14px;border-bottom:1px solid #4a4a46;height:20px"></div>
            <div style="font-size:10px;color:#8a8a84;margin-top:4px">Datum</div>
          </td>
          <td style="width:50%;padding-left:16px;vertical-align:top">
            <div style="color:#8a8a84;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Namens ${SCM.naam}</div>
            <div style="border-bottom:1px solid #4a4a46;height:36px"></div>
            <div style="font-size:10px;color:#8a8a84;margin-top:4px">Naam + handtekening</div>
            <div style="margin-top:14px;border-bottom:1px solid #4a4a46;height:20px"></div>
            <div style="font-size:10px;color:#8a8a84;margin-top:4px">Datum</div>
          </td>
        </tr>
      </table>
    </div>

    <!-- FOOTER -->
    <div style="position:absolute;bottom:0;left:0;right:0;padding-top:8px;border-top:1px solid #e8e7e2;font-size:9px;color:#8a8a84;text-align:center;line-height:1.5">
      <div style="font-weight:600;color:#4a4a46;font-size:9.5px">${SCM.naam} | ${SCM.locatie}</div>
      <div>${SCM.email} | ${SCM.telefoon}</div>
      <div>KvK: ${SCM.kvk} | BTW: ${SCM.btw} | IBAN: ${SCM.iban}</div>
    </div>

  </div>`;
}

async function init(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get('id');
  if(!id){
    document.getElementById('loadingMsg').textContent='Geen offerte ID opgegeven.';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'scm_offertes',id));
    if(!snap.exists()){
      document.getElementById('loadingMsg').textContent='Offerte niet gevonden.';
      return;
    }
    const o=snap.data();
    document.getElementById('loadingMsg').style.display='none';
    document.getElementById('printArea').innerHTML=renderOfferte(o);
    document.getElementById('printArea').style.display='block';
    document.title='Offerte '+o.nummer+' - '+o.klant_naam;
  }catch(e){
    console.error(e);
    document.getElementById('loadingMsg').textContent='Fout: '+e.message;
  }
}
init();
</script>
</body>
</html>
