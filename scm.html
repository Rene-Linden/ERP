<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Meneer — In ontwikkeling</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f8f7f4;--white:#fff;--ink:#1a1a18;--ink2:#4a4a46;--ink3:#8a8a84;
  --line:#e8e7e2;--line2:#d4d3cc;
  --acc:#2d5a8e;--acc-l:#edf3f9;--acc-m:#c8daf0;
  --amb:#b85c00;--amb-l:#fdf3e8;
  --r:12px;--rsm:8px;
}
body{
  background:linear-gradient(135deg,#f8f7f4 0%,#e8e7e2 100%);
  color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.wrap{
  max-width:520px;
  width:100%;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:48px 40px;
  text-align:center;
  box-shadow:0 4px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
}
.icon-wrap{
  width:100px;
  height:100px;
  border-radius:50%;
  background:var(--amb-l);
  border:2px solid rgba(184,92,0,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
}
.icon-wrap svg{width:52px;height:52px;stroke:var(--amb);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

h1{
  font-family:'Fraunces',serif;
  font-size:28px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:8px;
  letter-spacing:-.3px;
}
.sub{
  font-size:14px;
  color:var(--ink3);
  margin-bottom:32px;
}

.msg{
  background:var(--amb-l);
  border:1px solid rgba(184,92,0,.2);
  border-radius:var(--rsm);
  padding:18px 20px;
  color:var(--ink2);
  font-size:14px;
  line-height:1.6;
  text-align:left;
  margin-bottom:24px;
}
.msg strong{color:var(--amb);display:block;margin-bottom:6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}

.modules-list{
  text-align:left;
  background:var(--cream);
  border-radius:var(--rsm);
  padding:18px 20px;
  margin-bottom:28px;
}
.modules-list-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--ink3);
  font-weight:600;
  margin-bottom:10px;
}
.modules-list ul{list-style:none;padding:0;margin:0}
.modules-list li{
  padding:5px 0;
  color:var(--ink2);
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.modules-list li::before{
  content:"○";
  color:var(--ink3);
  font-size:16px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--acc);
  color:white;
  border:none;
  border-radius:var(--rsm);
  padding:12px 24px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  transition:all .15s;
}
.back-btn:hover{background:#254c78}
.back-btn svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="wrap">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/><path d="M3 14h18"/></svg>
  </div>

  <h1>Supply Chain Meneer</h1>
  <div class="sub">Supply Chain diensten</div>

  <div class="msg">
    <strong>In ontwikkeling</strong>
    Deze omgeving is nog niet beschikbaar. De ERP-modules worden in vervolgsessies gebouwd.
  </div>

  <div class="modules-list">
    <div class="modules-list-title">Geplande modules</div>
    <ul>
      <li>Offertes</li>
      <li>Facturen</li>
      <li>CRM (leads &amp; klanten)</li>
      <li>Omzet</li>
      <li>&hellip;en later meer</li>
    </ul>
  </div>

  <a href="start.html" class="back-btn">
    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Terug naar startscherm
  </a>
</div>

</body>
</html>
