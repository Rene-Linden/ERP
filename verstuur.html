<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1214">
<title>Ordinatio · Urengoedkeuring</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1214;
  --surface:#1a1f24;
  --surface-2:#242a30;
  --surface-3:#2d343b;
  --line:#2a3138;
  --line-2:#374049;
  --ink:#f5f7fa;
  --ink-2:#c6ccd4;
  --ink-3:#8892a0;
  --ink-4:#525a66;
  --rvdl:#4a90e2;
  --rvdl-soft:rgba(74,144,226,.14);
  --rvdl-line:rgba(74,144,226,.32);
  --green:#51cf66;
  --green-soft:rgba(81,207,102,.14);
  --amber:#ffa94d;
  --amber-soft:rgba(255,169,77,.14);
  --red:#ff6b6b;
  --red-soft:rgba(255,107,107,.14);
  --r-lg:20px;
  --r:14px;
  --r-sm:10px;
  --r-xs:8px;
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11';
}
.app{
  max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 24px);
}

/* HEADER */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px;gap:10px}
.brand-block{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--green-soft);border:1px solid rgba(81,207,102,.3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-icon svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{
  font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  color:var(--ink);letter-spacing:-0.01em;
}
.brand-sub{
  font-size:10px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;margin-top:1px;
  display:flex;align-items:center;gap:6px;
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}

.top-actions{display:flex;gap:6px;flex-shrink:0}
.top-btn{
  min-width:38px;height:38px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:12px;font-weight:500;
  padding:0 10px;gap:6px;
  text-decoration:none;
  transition:background .12s;
}
.top-btn:active{background:var(--surface-2)}
.top-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* TABS */
.tabs{
  display:flex;gap:0;
  border-bottom:1px solid var(--line);margin-bottom:20px;
}
.tab{
  flex:1;background:none;border:none;color:var(--ink-3);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  padding:12px 0;position:relative;transition:color .12s;
}
.tab.on{color:var(--ink)}
.tab.on::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:2px;background:var(--green);border-radius:2px;
}

.pane{display:none}
.pane.on{display:block}

/* CARDS */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:14px;
}
.section-title{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.1em;
  margin:20px 4px 10px;
}

/* FIELDS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{
  font-size:10px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;
}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-xs);padding:12px;
  color:var(--ink);font-family:inherit;font-size:15px;
  outline:none;transition:border-color .12s;
  -webkit-appearance:none;appearance:none;
  min-height:46px;width:100%;
  text-overflow:ellipsis;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-soft);border-color:rgba(81,207,102,.4)}
.field select{
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%238892a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;background-position:right 12px center;
  padding-right:36px;
}
.field textarea{resize:vertical;min-height:80px;line-height:1.4;font-size:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* PREVIEW CARD */
.preview-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:14px;
}
.preview-header{
  padding:12px 16px;background:var(--surface-2);
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;
  border-bottom:1px solid var(--line);
}
.preview-table{width:100%;border-collapse:collapse}
.preview-table td{
  padding:9px 16px;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--ink-2);
}
.preview-table td:first-child{color:var(--ink)}
.preview-table td:last-child{
  text-align:right;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);
}
.preview-table tr:last-child td{border-bottom:none}
.preview-total{
  padding:14px 16px;background:var(--surface-2);
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);
}
.preview-total-label{
  font-size:11px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.08em;
}
.preview-total-val{
  font-family:'JetBrains Mono',monospace;
  font-size:18px;font-weight:600;color:var(--green);
}

/* ALERT (no data) */
.alert-warn{
  background:var(--amber-soft);border:1px solid rgba(255,169,77,.25);
  border-radius:var(--r-xs);padding:12px 14px;
  font-size:13px;color:var(--amber);margin-bottom:14px;
}

/* KLANT INFO */
.klant-info{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-xs);padding:10px 12px;margin-bottom:12px;
  font-size:12px;color:var(--ink-2);
}
.klant-info strong{color:var(--ink);font-weight:600}

/* SEND BUTTON */
.send-btn{
  width:100%;background:var(--green);color:#0a1810;
  border:none;border-radius:var(--r);
  padding:16px;font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity .12s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;
}
.send-btn:active{opacity:0.85}
.send-btn:disabled{opacity:0.5;cursor:not-allowed}
.send-btn.loading .spin{display:block}
.spin{
  display:none;width:16px;height:16px;
  border:2px solid rgba(0,0,0,0.3);border-top-color:#0a1810;
  border-radius:50%;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* HISTORY */
.hist-item{
  padding:14px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s;
  background:var(--surface);
}
.hist-item:first-child{border-radius:var(--r) var(--r) 0 0}
.hist-item:last-child{border-bottom:none;border-radius:0 0 var(--r) var(--r)}
.hist-item:only-child{border-radius:var(--r)}
.hist-item:active{background:var(--surface-2)}
.hist-header{
  display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  cursor:pointer;
}
.hist-body-text{min-width:0}
.hist-title{
  font-size:14px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hist-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.status-pill{
  font-size:10px;font-weight:600;
  padding:3px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0;
}
.status-pill.wait{background:var(--amber-soft);color:var(--amber)}
.status-pill.ok{background:var(--green-soft);color:var(--green)}
.hist-detail{
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);display:none;
}
.hist-detail.on{display:block}

.det-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.det-table th{
  text-align:left;padding:6px 4px;
  font-size:10px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:0.06em;
  border-bottom:1px solid var(--line);
}
.det-table td{padding:6px 4px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.det-table tr:last-child td{border-bottom:none}

.act-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acc-badge{
  font-size:11px;color:var(--green);
  background:var(--green-soft);border:1px solid rgba(81,207,102,.25);
  padding:6px 12px;border-radius:var(--r-xs);font-weight:500;
}

.abtn{
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);border-radius:var(--r-xs);
  padding:8px 12px;font-family:inherit;font-size:12px;font-weight:500;
  cursor:pointer;
}
.abtn:active{background:var(--surface-3)}
.abtn.reset{color:var(--amber);border-color:rgba(255,169,77,.3)}
.abtn.del{color:var(--red);border-color:rgba(255,107,107,.3)}

.empty{
  padding:40px 20px;text-align:center;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);
}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:0.5}
.empty-text{font-size:14px}

/* CSS var aliases (voor inline styles in JS) */
:root{
  --grn:var(--green);
  --grn-l:var(--green-soft);
  --acc:var(--rvdl);
  --acc-l:var(--rvdl-soft);
  --acc-m:var(--rvdl-line);
  --ink3:var(--ink-3);
  --amb:var(--amber);
  --amb-l:var(--amber-soft);
  --red-l:var(--red-soft);
  --line2:var(--line-2);
  --cream:var(--surface);
  --white:var(--surface);
  --rsm:var(--r-sm);
  --rxs:var(--r-xs);
}

/* Sync dot in header */
.brand-sub .sync-dot{
  transition:background .2s;
}
.brand-sub .sync-dot.syncing{background:var(--amber)}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--ink);
  padding:12px 20px;border-radius:var(--r);
  font-family:inherit;font-size:13px;font-weight:500;
  z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.4);
  border:1px solid var(--line);
  opacity:0;transition:opacity .2s;
  max-width:340px;text-align:center;
}
.toast.show{opacity:1}
.toast.ok{border-color:rgba(81,207,102,.4);color:var(--green)}
.toast.bad{border-color:rgba(255,107,107,.4);color:var(--red)}

/* MODAL (duplicate detection) */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;
  z-index:9999;padding:16px;
}
.modal-backdrop.show{display:flex}
.modal-inner{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;max-width:420px;width:100%;
}
.modal-title{
  font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--ink);
  margin-bottom:12px;
}
.modal-body{font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:16px}
.modal-body strong{color:var(--ink)}
.modal-actions{display:flex;flex-direction:column;gap:8px}
.mbtn{
  padding:12px;border-radius:var(--r-xs);border:none;
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  transition:opacity .12s;
}
.mbtn:active{opacity:0.85}
.mbtn.primary{background:var(--rvdl);color:#fff}
.mbtn.danger{background:var(--red);color:#fff}
.mbtn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* VERSION */
.version-footer{
  margin-top:32px;padding-top:20px;
  border-top:1px solid var(--line);
  text-align:center;font-size:10px;color:var(--ink-4);
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand-block">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
      </div>
      <div>
        <div class="brand-name">Urengoedkeuring</div>
        <div class="brand-sub">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncTxt">Verbinden…</span>
        </div>
      </div>
    </div>
    <div class="top-actions">
      <a href="hub.html" class="top-btn" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="index.html?bedrijf=RvdL" class="top-btn" title="Dagstaat">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </a>
      <a href="factuur.html" class="top-btn" title="Factuur">
        <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
      </a>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab on" onclick="showTab('uren',this)">Urenspecificatie</button>
    <button class="tab" onclick="showTab('history',this)">Geschiedenis</button>
  </div>

  <!-- PANE: URENSPECIFICATIE -->
  <div class="pane on" id="pane-uren">
    <div class="card">
      <div class="field">
        <label>Opdrachtgever</label>
        <select id="v-klant"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Maand</label>
          <select id="v-maand"></select>
        </div>
        <div class="field">
          <label>Jaar</label>
          <select id="v-jaar"></select>
        </div>
      </div>
    </div>

    <div class="preview-card" id="previewCard" style="display:none">
      <div class="preview-header">Voorbeeld — geregistreerde dagen</div>
      <table class="preview-table">
        <tbody id="previewBody"></tbody>
      </table>
      <div class="preview-total">
        <span class="preview-total-label">Totaal uren</span>
        <span class="preview-total-val" id="previewTotal">–</span>
      </div>
    </div>

    <div id="noDataMsg" class="alert-warn" style="display:none">
      Geen geregistreerde uren in deze periode. Kies een andere maand of ga naar de dagstaat om uren in te vullen.
    </div>

    <div class="card">
      <div class="klant-info" id="klantInfoWrap" style="display:none"><div id="klantInfoTxt"></div></div>
      <div class="field">
        <label>E-mailadres ontvanger</label>
        <input type="email" id="v-email" placeholder="naam@bedrijf.nl">
      </div>
      <div class="field">
        <label>Bericht (optioneel)</label>
        <textarea id="v-note" placeholder="Bijv. Hierbij de urenspecificatie voor april."></textarea>
      </div>
    </div>

    <button class="send-btn" id="sendBtn">
      <span>Verstuur urenspecificatie</span>
      <div class="spin"></div>
    </button>
  </div>

  <!-- PANE: HISTORY -->
  <div class="pane" id="pane-history">
    <div class="section-title">Verstuurde specificaties</div>
    <div id="historyList" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden"></div>
  </div>

  <div class="version-footer">v74-dark</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- DUPLICATE MODAL -->
<div class="modal-backdrop" id="dupModal">
  <div class="modal-inner">
    <div class="modal-title">Al eerder verstuurd</div>
    <div class="modal-body" id="dupModalBody">–</div>
    <div class="modal-actions">
      <button class="mbtn danger" id="dupBtnReplace">Oude vervangen en opnieuw versturen</button>
      <button class="mbtn primary" id="dupBtnExtra">Extra versturen (oude behouden)</button>
      <button class="mbtn ghost" id="dupBtnCancel">Annuleren</button>
    </div>
  </div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,deleteDoc,updateDoc,onSnapshot,collection,addDoc,query,orderBy,getDocs}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={
  apiKey:"AIzaSyBW4shtJ-2UlPMg1tHs3GUrNhfg6ocKxjY",
  authDomain:"dagstaat-ordinatio.firebaseapp.com",
  projectId:"dagstaat-ordinatio",
  storageBucket:"dagstaat-ordinatio.firebasestorage.app",
  messagingSenderId:"841107130686",
  appId:"1:841107130686:web:f91211f83a8e031746846f"
};

emailjs.init('LVecJZWPqdswbZbga');
const app = initializeApp(FB);
const db = getFirestore(app);

const MO = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MOS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DY = ['zo','ma','di','wo','do','vr','za'];

let days = {};
let clients = [];

// ── HELPERS ───────────────────────────────────
const p2 = n => String(n).padStart(2,'0');
const m2s = m => `${Math.floor(m/60)}:${p2(m%60)}`;
const tMins = t => { if(!t) return 0; const[h,m]=t.split(':').map(Number); return h*60+m; };
const bMins = b => Math.max(0, (tMins(b.end)-tMins(b.start)) - (parseInt(b.brk)||0));

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

function setSync(s, txt) {
  const d = document.getElementById('syncDot');
  const t = document.getElementById('syncTxt');
  // Map: '' → ok, 'off' → err, anders → syncing
  const cls = s === '' ? 'ok' : s === 'off' ? 'err' : 'syncing';
  d.className = `sync-dot ${cls}`;
  t.textContent = txt;
}

// ── LOAD DATA ─────────────────────────────────
onSnapshot(doc(db,'dagstaat','data'), snap => {
  days = snap.exists() ? (snap.data().days || {}) : {};
  setSync('', 'Gesynchroniseerd');
  buildPreview();
}, err => {
  setSync('off', 'Offline');
});

function loadClients() {
  clients = JSON.parse(localStorage.getItem('dgs_clients_v1') || '[]');
  if (!clients.length) {
    clients = [
      {name:'Sitech',rate:115,color:'#2d5a8e',email:'',contact:'',phone:'',address:'',city:''},
      {name:'Dysel',rate:110,color:'#1e7a4a',email:'',contact:'',phone:'',address:'',city:''},
      {name:'Seeder',rate:110,color:'#b85c00',email:'',contact:'',phone:'',address:'',city:''},
      {name:'HG',rate:110,color:'#7b3f9e',email:'',contact:'',phone:'',address:'',city:''},
      {name:'Nabuurs',rate:110,color:'#c0392b',email:'',contact:'',phone:'',address:'',city:''},
    ];
  }
}

// ── INIT ──────────────────────────────────────
function init() {
  loadClients();

  // Klant dropdown
  const sel = document.getElementById('v-klant');
  sel.innerHTML = '<option value="">Kies opdrachtgever…</option>' +
    clients.filter(c => c.name !== 'Intern')
           .map(c => `<option value="${c.name}">${c.name}</option>`)
           .join('');
  sel.addEventListener('change', onKlantChange);

  // Maand dropdown
  const now = new Date();
  const mSel = document.getElementById('v-maand');
  mSel.innerHTML = MO.map((m,i) =>
    `<option value="${i}"${i===now.getMonth()?' selected':''}>${m}</option>`
  ).join('');
  mSel.addEventListener('change', buildPreview);

  // Jaar dropdown
  const ySel = document.getElementById('v-jaar');
  ySel.innerHTML = [0,1,2].map(d =>
    `<option value="${now.getFullYear()-d}"${d===0?' selected':''}>${now.getFullYear()-d}</option>`
  ).join('');
  ySel.addEventListener('change', buildPreview);

  // Send button
  document.getElementById('sendBtn').addEventListener('click', verstuur);
}

// ── KLANT CHANGE ──────────────────────────────
function onKlantChange() {
  const name = document.getElementById('v-klant').value;
  const wrap = document.getElementById('klantInfoWrap');
  const txt = document.getElementById('klantInfoTxt');
  const emailEl = document.getElementById('v-email');

  const c = clients.find(x => x.name === name);
  if (c && (c.contact || c.address || c.phone || c.email)) {
    let info = '';
    if (c.contact) info += `<strong>${c.contact}</strong><br>`;
    if (c.address) info += `${c.address}<br>`;
    if (c.city) info += `${c.city}<br>`;
    if (c.phone) info += `📞 ${c.phone}`;
    txt.innerHTML = info;
    wrap.style.display = 'block';
    if (c.email) emailEl.value = c.email;
  } else {
    wrap.style.display = 'none';
    emailEl.value = '';
  }
  buildPreview();
}

// ── BUILD PREVIEW ─────────────────────────────
function buildPreview() {
  const klant = document.getElementById('v-klant').value;
  const maand = parseInt(document.getElementById('v-maand').value);
  const jaar = parseInt(document.getElementById('v-jaar').value);
  const card = document.getElementById('previewCard');
  const noData = document.getElementById('noDataMsg');

  if (!klant) { card.style.display='none'; noData.style.display='none'; return; }

  const pfx = `${jaar}-${p2(maand+1)}`;
  const regels = Object.keys(days)
    .filter(d => d.startsWith(pfx))
    .sort()
    .flatMap(k => days[k].filter(b => b.klant === klant).map(b => ({...b, date:k})));

  if (!regels.length) {
    card.style.display = 'none';
    noData.style.display = 'block';
    return;
  }
  noData.style.display = 'none';

  const totalMins = regels.reduce((s,r) => s+bMins(r), 0);
  document.getElementById('previewBody').innerHTML = regels.map(r => {
    const d = new Date(r.date);
    return `<tr>
      <td><strong>${DY[d.getDay()]} ${d.getDate()} ${MOS[d.getMonth()]}</strong></td>
      <td style="font-family:'DM Mono',monospace;font-size:12px">${r.start}</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px">${r.end}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-size:12px;font-weight:600">${m2s(bMins(r))}</td>
    </tr>`;
  }).join('');
  document.getElementById('previewTotal').textContent = m2s(totalMins);
  card.style.display = 'block';
}

// ── VERSTUUR ──────────────────────────────────
async function verstuur() {
  const klant = document.getElementById('v-klant').value;
  const email = document.getElementById('v-email').value.trim();
  const maand = parseInt(document.getElementById('v-maand').value);
  const jaar = parseInt(document.getElementById('v-jaar').value);

  if (!klant) { toast('Kies een opdrachtgever', 'bad'); return; }
  if (!email || !email.includes('@')) { toast('Voer een geldig emailadres in', 'bad'); return; }

  const pfx = `${jaar}-${p2(maand+1)}`;
  const regels = Object.keys(days)
    .filter(d => d.startsWith(pfx))
    .sort()
    .flatMap(k => days[k].filter(b => b.klant === klant).map(b => ({...b, date:k})));

  if (!regels.length) { toast('Geen registraties voor deze periode', 'bad'); return; }

  // Check of er al specs bestaan voor deze klant+maand+jaar
  const bestaandQ = query(collection(db,'specs'), orderBy('verstuurd_datum','desc'));
  const bestaandSnap = await getDocs(bestaandQ);
  const matches = bestaandSnap.docs.filter(d => {
    const data = d.data();
    return data.klant === klant && data.maand === maand && data.jaar === jaar;
  });

  // Als er al een geaccordeerde is: blokkeren
  const geaccordeerd = matches.find(d => d.data().akkoord === true);
  if (geaccordeerd) {
    toast('Er is al een geaccordeerde specificatie voor deze periode', 'bad');
    return;
  }

  // Als er al een niet-geaccordeerde is: dialoog tonen
  const openstaand = matches.filter(d => d.data().akkoord !== true);
  if (openstaand.length > 0) {
    const laatste = openstaand[0].data();
    const vd = new Date(laatste.verstuurd_datum);
    const datumStr = `${vd.getDate()} ${MOS[vd.getMonth()]} ${vd.getFullYear()} om ${p2(vd.getHours())}:${p2(vd.getMinutes())}`;
    const aantalStr = openstaand.length > 1 ? `Er zijn al ${openstaand.length} openstaande specificaties` : 'Er is al een openstaande specificatie';
    document.getElementById('dupModalBody').innerHTML =
      `${aantalStr} voor <strong>${klant} — ${MO[maand]} ${jaar}</strong> die nog niet is geaccordeerd.` +
      `<div class="detail-line">Laatste verstuurd: ${datumStr} naar ${laatste.email}</div>`;
    toonDupModal(openstaand.map(d => d.id));
    return;
  }

  // Geen bestaande specs: gewoon versturen
  doSend();
}

// ── TOON DUPLICAAT-DIALOOG ────────────────────
function toonDupModal(openstaandeIds) {
  const modal = document.getElementById('dupModal');
  const btnReplace = document.getElementById('dupBtnReplace');
  const btnExtra = document.getElementById('dupBtnExtra');
  const btnCancel = document.getElementById('dupBtnCancel');

  // Bestaande handlers verwijderen (prevent stacking bij herhaaldelijk openen)
  const newReplace = btnReplace.cloneNode(true);
  const newExtra = btnExtra.cloneNode(true);
  const newCancel = btnCancel.cloneNode(true);
  btnReplace.replaceWith(newReplace);
  btnExtra.replaceWith(newExtra);
  btnCancel.replaceWith(newCancel);

  newReplace.addEventListener('click', async () => {
    modal.classList.remove('on');
    toast('Oude specificatie(s) verwijderen…', 'info');
    try {
      for (const id of openstaandeIds) {
        await deleteDoc(doc(db,'specs',id));
      }
      doSend();
    } catch(e) {
      console.error(e);
      toast('Verwijderen mislukt: ' + e.message, 'bad');
    }
  });

  newExtra.addEventListener('click', () => {
    modal.classList.remove('on');
    doSend();
  });

  newCancel.addEventListener('click', () => {
    modal.classList.remove('on');
  });

  modal.classList.add('on');
}

// ── DAADWERKELIJKE VERZENDING ─────────────────
async function doSend() {
  const klant = document.getElementById('v-klant').value;
  const email = document.getElementById('v-email').value.trim();
  const maand = parseInt(document.getElementById('v-maand').value);
  const jaar = parseInt(document.getElementById('v-jaar').value);
  const note = document.getElementById('v-note').value.trim();

  const pfx = `${jaar}-${p2(maand+1)}`;
  const regels = Object.keys(days)
    .filter(d => d.startsWith(pfx))
    .sort()
    .flatMap(k => days[k].filter(b => b.klant === klant).map(b => ({...b, date:k})));

  const btn = document.getElementById('sendBtn');
  btn.classList.add('loading'); btn.disabled = true;

  try {
    const totalMins = regels.reduce((s,r) => s+bMins(r), 0);
    const maandStr = `${MO[maand]} ${jaar}`;

    // Save to Firebase
    const specRef = await addDoc(collection(db,'specs'), {
      klant, maand, jaar, email,
      regels: regels.map(r => ({klant:r.klant, start:r.start, end:r.end, brk:r.brk||0, km:r.km||0, date:r.date})),
      totaal_mins: totalMins,
      verstuurd_datum: new Date().toISOString(),
      akkoord: false,
      akkoord_datum: null,
      note
    });

    const specDocId = specRef.id;
    const akkoordLink = `https://rene-linden.github.io/ERP/accordeer.html?id=${specDocId}`;
    const afkeurLink = `https://rene-linden.github.io/ERP/accordeer.html?id=${specDocId}&actie=afkeuren`;

    // Build email table (ALLEEN tabel + optionele noot — geen Niet akkoord-knop!
    // De knop staat in de EmailJS-template zelf via {{afkeur_link}})
    const noteHTML = note ? `<p style="font-family:Arial,sans-serif;font-size:14px;color:#4a4a46;margin:0 0 16px;font-style:italic">${note}</p>` : '';
    const tabelHTML = noteHTML + `<table style="width:100%;border-collapse:collapse;font-size:13px;font-family:Arial,sans-serif">
      <thead><tr style="background:#edf3f9">
        <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c8daf0;color:#2d5a8e">Datum</th>
        <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c8daf0;color:#2d5a8e">Start</th>
        <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c8daf0;color:#2d5a8e">Eind</th>
        <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c8daf0;color:#2d5a8e">Pauze</th>
        <th style="padding:8px 10px;text-align:right;border-bottom:2px solid #c8daf0;color:#2d5a8e">Uren</th>
      </tr></thead>
      <tbody>${regels.map((r,i) => {
        const d = new Date(r.date);
        return `<tr style="background:${i%2===0?'#fff':'#f8f7f4'}">
          <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;font-weight:600">${DY[d.getDay()]} ${d.getDate()} ${MOS[d.getMonth()]}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;font-family:monospace">${r.start}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;font-family:monospace">${r.end}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;color:#8a8a84">${r.brk||0}min</td>
          <td style="padding:8px 10px;border-bottom:1px solid #e8e7e2;text-align:right;font-weight:600;font-family:monospace;color:#2d5a8e">${m2s(bMins(r))}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

    await emailjs.send('service_rpek59r','template_p4r2rkp', {
      to_email: email,
      klant: klant,
      naam: 'Rene van der Linden',
      maand: maandStr,
      tabel: tabelHTML,
      totaal_uren: m2s(totalMins),
      akkoord_link: akkoordLink,
      afkeur_link: afkeurLink,
      spec_id: specDocId,
      email: 'info@renevanderlinden.com'
    });

    toast(`Verstuurd naar ${email} ✓`, 'ok');
    document.getElementById('v-note').value = '';
    document.getElementById('v-email').value = '';
    document.getElementById('v-klant').value = '';
    document.getElementById('previewCard').style.display = 'none';
    loadHistory();

  } catch(e) {
    console.error(e);
    toast('Fout: ' + e.message, 'bad');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ── HISTORY ───────────────────────────────────
async function loadHistory() {
  const el = document.getElementById('historyList');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">Laden…</div></div>';
  try {
    const q = query(collection(db,'specs'), orderBy('verstuurd_datum','desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📨</div><div class="empty-text">Nog niets verstuurd</div></div>';
      return;
    }

    el.innerHTML = '';
    snap.docs.forEach(d => {
      const id = d.id;
      const data = d.data();
      const vd = new Date(data.verstuurd_datum);
      const totalMins = data.totaal_mins || (data.regels||[]).reduce((s,r) => s+bMins(r), 0);
      const akkDatum = data.akkoord_datum
        ? new Date(data.akkoord_datum).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})
        : '';

      const item = document.createElement('div');
      item.className = 'hist-item';

      const header = document.createElement('div');
      header.className = 'hist-header';
      header.innerHTML = `
        <div class="hist-body-text">
          <div class="hist-title">${data.klant} — ${MO[data.maand]} ${data.jaar}</div>
          <div class="hist-sub">${data.email} · ${vd.getDate()} ${MOS[vd.getMonth()]} · ${m2s(totalMins)}</div>
        </div>
        <div class="status-pill ${data.akkoord?'ok':'wait'}">${data.akkoord?'✓ Akkoord':'⏳ Wacht'}</div>
        <span style="color:var(--ink3);font-size:14px;margin-left:6px">›</span>`;

      const detail = document.createElement('div');
      detail.className = 'hist-detail';
      detail.id = 'det-' + id;

      let detHTML = '';
      if (data.akkoord && akkDatum) {
        detHTML += `<div style="font-size:12px;color:var(--grn);margin-bottom:10px;font-weight:500">✓ Geaccordeerd op ${akkDatum}</div>`;
      }

      detHTML += `<table class="det-table">
        <thead><tr><th>Datum</th><th>Start</th><th>Eind</th><th>Pauze</th><th style="text-align:right">Uren</th></tr></thead>
        <tbody>${(data.regels||[]).map(r => {
          const rd = new Date(r.date);
          return `<tr>
            <td><strong>${DY[rd.getDay()]} ${rd.getDate()} ${MOS[rd.getMonth()]}</strong></td>
            <td style="font-family:'DM Mono',monospace">${r.start}</td>
            <td style="font-family:'DM Mono',monospace">${r.end}</td>
            <td style="color:var(--ink3)">${r.brk||0}min</td>
            <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:600;color:var(--acc)">${m2s(bMins(r))}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;

      detHTML += '<div class="act-row">';
      if (data.akkoord) {
        detHTML += `<span class="acc-badge">✓ Geaccordeerd — aanpassen niet mogelijk</span>`;
        detHTML += `<button class="abtn reset" data-id="${id}" data-action="reset">⟳ Reset akkoord</button>`;
      } else {
        detHTML += `<button class="abtn" data-id="${id}" data-action="herstuur">↺ Opnieuw versturen</button>`;
        detHTML += `<button class="abtn del" data-id="${id}" data-action="delete">✕ Verwijderen</button>`;
      }
      detHTML += '</div>';

      detail.innerHTML = detHTML;

      header.addEventListener('click', () => {
        detail.classList.toggle('on');
      });

      detail.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const action = btn.dataset.action;
          const specId = btn.dataset.id;

          if (action === 'delete') {
            if (!confirm('Specificatie definitief verwijderen?')) return;
            await deleteDoc(doc(db,'specs',specId));
            toast('Verwijderd', 'info');
            loadHistory();

          } else if (action === 'reset') {
            if (!confirm('Akkoord ongedaan maken?')) return;
            await updateDoc(doc(db,'specs',specId), {akkoord:false, akkoord_datum:null});
            toast('Akkoord gereset', 'info');
            loadHistory();

          } else if (action === 'herstuur') {
            const snap2 = await getDoc(doc(db,'specs',specId));
            if (!snap2.exists()) return;
            const d2 = snap2.data();
            showTab('uren', document.querySelector('.tab'));
            document.getElementById('v-klant').value = d2.klant;
            onKlantChange();
            document.getElementById('v-maand').value = d2.maand;
            document.getElementById('v-jaar').value = d2.jaar;
            if (d2.email) document.getElementById('v-email').value = d2.email;
            buildPreview();
            toast('Gegevens ingeladen — pas aan en verstuur opnieuw', 'info');
          }
        });
      });

      item.appendChild(header);
      item.appendChild(detail);
      el.appendChild(item);
    });

  } catch(e) {
    console.error(e);
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Laden mislukt: ' + e.message + '</div></div>';
  }
}

// ── TABS ──────────────────────────────────────
window.showTab = function(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pane-' + name).classList.add('on');
  if (name === 'history') loadHistory();
};

init();
</script>
