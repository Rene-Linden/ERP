<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordinatio Groep — Startscherm</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#f8f7f4;--white:#fff;--ink:#1a1a18;--ink2:#4a4a46;--ink3:#8a8a84;
  --line:#e8e7e2;--line2:#d4d3cc;
  --acc:#2d5a8e;--acc-l:#edf3f9;--acc-m:#c8daf0;
  --grn:#1e7a4a;--grn-l:#eaf5ee;
  --amb:#b85c00;--amb-l:#fdf3e8;
  --r:12px;--rsm:8px;--rxs:6px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04);
  --shadow-md:0 4px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
}
body{
  background:linear-gradient(135deg, #f8f7f4 0%, #e8e7e2 100%);
  color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.wrap{max-width:900px;width:100%;text-align:center}

.brand{margin-bottom:48px}
.brand-title{
  font-family:'Fraunces',serif;
  font-size:38px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:8px;
  letter-spacing:-.5px;
}
.brand-sub{
  font-size:15px;
  color:var(--ink3);
  font-weight:400;
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  max-width:720px;
  margin:0 auto;
}

.tile{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:36px 28px;
  cursor:pointer;
  transition:all .2s ease;
  box-shadow:var(--shadow-sm);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  min-height:280px;
  justify-content:center;
  text-decoration:none;
  color:var(--ink);
}
.tile:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
  border-color:var(--acc-m);
}
.tile:active{transform:translateY(-2px)}

.tile-logo{
  width:180px;
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tile-logo img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.tile-placeholder{
  width:120px;
  height:100px;
  border:2px dashed var(--line2);
  border-radius:var(--rsm);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink3);
  background:var(--cream);
}
.tile-placeholder svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5}

.tile-name{
  font-family:'Fraunces',serif;
  font-size:20px;
  font-weight:600;
  color:var(--ink);
  line-height:1.3;
}
.tile-sub{
  font-size:13px;
  color:var(--ink3);
  font-weight:400;
}
.tile-badge{
  display:inline-block;
  background:var(--amb-l);
  color:var(--amb);
  border:1px solid rgba(184,92,0,.25);
  font-size:11px;
  font-weight:600;
  padding:3px 10px;
  border-radius:20px;
  margin-top:6px;
}

.footer{
  margin-top:56px;
  font-size:12px;
  color:var(--ink3);
}

@media (max-width:600px){
  .brand-title{font-size:28px}
  .tile{padding:28px 20px;min-height:240px}
  .tile-logo{width:150px;height:80px}
}
</style>
</head>
